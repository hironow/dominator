# Dependabot config for dominator.
#
# Supply-chain cooldown (org standard): wait 7 days before adopting newly
# published versions, so a compromised release is caught by the ecosystem
# before it can reach this repo.
#
# Grouping: this repo pulls in nine go.opentelemetry.io modules that are
# released together and share a version. Ungrouped, each one arrives as its own
# PR, and merging any of them leaves the rest with a conflicting go.mod/go.sum —
# which is exactly what happened to #100-#104 (five otel PRs; two went DIRTY on
# the first merge and had to be rebased). Group the module families that move in
# lockstep so they land as one PR. Mirrors hironow/runops-gateway.
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "18:36"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: gomod
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: /
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: /
    cooldown:
      default-days: 7
